name: Club sync
# Pulls club league tables, fixtures and results (TTBL, women's Bundesliga, T.League, MLTT) every hour.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: club-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync club leagues
        run: python3 tools/club_sync.py
      - name: Commit changes
        run: |
          git config user.name "Tom Mortimer"
          git config user.email "tommorti@gmail.com"
          git add data/clubs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Club sync $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
