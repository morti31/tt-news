name: Deploy
# Builds the site and deploys it to Cloudflare Workers from GitHub, so Cloudflare's monthly build minutes are not used.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers) and CLOUDFLARE_ACCOUNT_ID.
# Runs on every push to main (syncs pushed with the workflow token do not trigger it, so Pulse starts one every 30 minutes).
# Runs queue one deep: while a deploy is going, any number of newer requests collapse into a single next run.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip when this commit is already live
        id: skip
        run: |
          head=$(git rev-parse HEAD)
          live=$(gh run list -R "${{ github.repository }}" --workflow deploy.yml --status success -L 1 --json headSha -q '.[0].headSha' || true)
          if [ "$head" = "$live" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$head is already deployed"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check secrets
        if: steps.skip.outputs.skip != 'true'
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets"; exit 1; }
      - uses: actions/setup-python@v5
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          path: ~/.npm
          key: npm-pagefind-1.5.2-wrangler-4
      - name: Build the site
        if: steps.skip.outputs.skip != 'true'
        run: python3 tools/build_site.py
      - name: Build the search index
        if: steps.skip.outputs.skip != 'true'
        run: npx --yes pagefind@1.5.2
      - name: Deploy to Cloudflare
        if: steps.skip.outputs.skip != 'true'
        run: npx --yes wrangler@4 deploy
