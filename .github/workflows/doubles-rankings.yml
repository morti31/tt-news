name: Doubles rankings
# The ITTF doubles world rankings (top 200 pairs in men's, women's and mixed doubles), after each Monday's ranking.
on:
  schedule:
    - cron: "33 9 * * 2"
  workflow_dispatch:
    inputs:
      args:
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: doubles-rankings
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the doubles rankings
        run: python3 tools/doubles_rankings.py ${{ inputs.args }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/doubles-rankings.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Doubles rankings $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
