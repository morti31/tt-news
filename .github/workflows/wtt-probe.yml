name: WTT probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WTT live endpoints
        run: |
          B="https://wtt-website-api-vm-frontdoor-hhaec5epbhdyfugz.a01.azurefd.net/liveeventsapi/api/cms"
          H=(-H "Origin: https://www.worldtabletennis.com" -H "Referer: https://www.worldtabletennis.com/")
          for p in "GetLiveResult?EventId=3250" "GetOfficialResult?EventId=3250&include_match_card=false&take=5" "GetEventSchedule/3250" "GetEventInfo/3250" "GetMatchCardDetails/3250" "GetBrackets/3250/TTEWSINGLES-------------------------------"; do
            echo "=== $p"
            curl -s -m 20 -w "\nHTTP %{http_code}\n" "${H[@]}" "$B/$p" | head -c 2500
            echo
          done
