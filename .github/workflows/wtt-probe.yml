name: WTT probe
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated paths under liveeventsapi/api/cms/, or full URLs"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WTT live endpoints and save the replies to the probe branch
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          B="https://wtt-website-api-vm-frontdoor-hhaec5epbhdyfugz.a01.azurefd.net/liveeventsapi/api/cms"
          mkdir out && cd out
          i=0
          for p in $PATHS; do
            i=$((i+1))
            echo "$p" > "$i.path"
            case "$p" in http*) U="$p";; *) U="$B/$p";; esac
            curl -s -m 25 -o "$i.body" -w "%{http_code}" -H "Origin: https://www.worldtabletennis.com" -H "Referer: https://www.worldtabletennis.com/" "$U" > "$i.status" || true
            case "$p" in http*) case "$p" in *wtt*|*workers.dev*) ;; *) gzip -9 "$i.body";; esac;; esac
          done
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add . && git commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
