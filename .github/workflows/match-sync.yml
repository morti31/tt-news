name: Match sync
# Eleven's match database (data/matches) and player records: WTT official results, every six hours.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Optional: an event id range to load, e.g. '2700 3420', 'refill' for events with results but no matches saved, or 'youth' to load youth results (U17 and up) since 2025"
        required: false
        default: ""
      players:
        description: "Also refresh WTT's record for every ranked player (yes to run)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: match-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Sync matches and players
        env:
          BACKFILL: ${{ inputs.backfill }}
          PLAYERS: ${{ inputs.players }}
        run: |
          P=""; [ "$PLAYERS" = "yes" ] && P="--players"
          if [ "$BACKFILL" = "youth" ]; then python3 tools/youth_sync.py --backfill; exit 0; fi
          if [ "$BACKFILL" = "refill" ]; then python3 tools/match_sync.py --refill-empty $P; elif [ -n "$BACKFILL" ]; then python3 tools/match_sync.py --backfill $BACKFILL --senior $P; else python3 tools/match_sync.py $P; fi
          python3 tools/youth_sync.py || echo "youth sync failed"
      - name: Commit changes
        run: |
          git config user.name "Tom Mortimer"
          git config user.email "tommorti@gmail.com"
          git add data/matches data/players/wtt.json data/ranking-history.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Match sync $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 15; done
          exit 1
