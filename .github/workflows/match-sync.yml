name: Match sync
# Eleven's match database (data/matches) and player records: WTT official results, every six hours.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Optional: an event id range to load, e.g. '2700 3420', or 'refill' for events with results but no matches saved"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: match-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Sync matches and players
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "refill" ]; then python3 tools/match_sync.py --refill-empty; elif [ -n "$BACKFILL" ]; then python3 tools/match_sync.py --backfill $BACKFILL --players; else python3 tools/match_sync.py; fi
      - name: Commit changes
        run: |
          git config user.name "Tom Mortimer"
          git config user.email "tommorti@gmail.com"
          git add data/matches data/players/wtt.json data/ranking-history.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Match sync $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 15; done
          exit 1
