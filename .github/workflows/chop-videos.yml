name: Chop videos
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chop-videos
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find new videos of The Chop's featured defenders
        run: python3 tools/chop_videos.py
      - name: Commit changes
        run: |
          git config user.name "Tom Mortimer"
          git config user.email "tommorti@gmail.com"
          git add data/chop/videos.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Chop videos $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 15; done
          exit 1
