name: Sync event pages
# Every upcoming WTT event on the schedule gets an event page (tools/sync_hubs.py), with its poster drawn
# (tools/posters.py --missing). Started by Pulse every few hours and by hand; does nothing when nothing is missing.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-hubs
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add missing event pages
        id: hubs
        run: |
          n=$(python3 tools/sync_hubs.py | head -1)
          echo "changes=$n" >> "$GITHUB_OUTPUT"
          echo "$n change(s)"
      - name: Draw missing posters
        if: steps.hubs.outputs.changes != '0'
        run: |
          pip install playwright >/dev/null && python3 -m playwright install --with-deps chromium >/dev/null
          python3 tools/posters.py --missing
      - name: Commit
        run: |
          git config user.name "sync-hubs" && git config user.email "sync@example.com"
          git add data/events.json img/posters
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "Event pages: add missing WTT events from the schedule"
          git pull -q --rebase origin main && git push -q origin HEAD:main
